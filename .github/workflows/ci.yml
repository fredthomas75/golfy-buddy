name: CI

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      # Build-health gate. (The legacy scaffold test suite has no fixtures/coverage;
      # replacing it with real tests is a tracked follow-up.)
      - name: Load schema
        run: bin/rails db:create db:schema:load

      - name: Zeitwerk autoload check
        run: bin/rails zeitwerk:check

      - name: Build assets (esbuild + Dart Sass)
        run: bin/rails assets:precompile
